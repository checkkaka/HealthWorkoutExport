name: Setup Flutter and Rust
description: Checkout 之后安装 stable Rust、cargo 缓存和 stable Flutter。
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust/workout_core
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Show tool versions
      shell: bash
      run: |
        rustc --version
        flutter --version
