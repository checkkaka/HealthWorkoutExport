[package]
name = "rust_lib_health_workout_export"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
sha2 = "=0.11.0"
time = { version = "=0.3.55", default-features = false, features = ["formatting"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
